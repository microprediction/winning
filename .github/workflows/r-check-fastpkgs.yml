name: R CMD check fast packages

on:
  push:
    paths: ["r/mvtnormfast/**", "r/mlogitfast/**", "r/rprobitfast/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install deps
        run: Rscript -e 'install.packages(c("mvtnorm","testthat"), repos="https://cloud.r-project.org")'
      - name: Check mvtnormfast (as-cran)
        run: |
          cd r
          R CMD build mvtnormfast
          R CMD check --as-cran --no-manual mvtnormfast_*.tar.gz
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: mvtnormfast-tarball
          path: r/mvtnormfast_*.tar.gz
