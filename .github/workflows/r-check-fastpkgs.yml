name: R CMD check fast packages

on:
  push:
    branches: [main]
    paths: ["r/mvtnormfast/**", "r/mlogitfast/**", "r/rprobitfast/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          # Linux binaries from the public package manager. Building from
          # source pulls testthat -> fs, which needs libuv headers the
          # runner does not carry: "fatal error: uv.h: No such file or
          # directory", and the whole check fails before it reaches any R
          # package of ours.
          use-public-rspm: true
      - name: Install deps
        run: Rscript -e 'install.packages(c("mvtnorm","testthat"))'
      - name: Check mvtnormfast (as-cran)
        run: |
          cd r
          R CMD build mvtnormfast
          R CMD check --as-cran --no-manual mvtnormfast_*.tar.gz
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: mvtnormfast-tarball
          path: r/mvtnormfast_*.tar.gz
