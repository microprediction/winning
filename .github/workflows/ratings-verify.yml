name: ratings-verify

# The ratings layer's own verification suite (winning.ratings.verify):
# the FAST profile gates every push through tests/test_ratings_verify.py
# in ci.yml; this workflow runs the FULL profile nightly and on demand,
# fails on any FAIL (exit 1) or UNDERPOWERED (exit 2), and uploads the
# JSON and markdown reports as an artifact. Adjudicated runs are
# committed by hand under research/adjudications/ratings_verify/runs/.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "verify profile"
        default: "full"
        type: choice
        options: [smoke, fast, full, exhaustive]
      only:
        description: "glob on check names (optional)"
        default: ""
      workers:
        description: "process workers"
        default: "4"

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install core only (the verifier needs nothing beyond numpy and scipy)
        run: pip install -e .
      - name: Run the profile
        # inputs reach the shell through env, never by template expansion
        # into the script, so an input cannot inject shell code
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile || 'full' }}
          INPUT_WORKERS: ${{ github.event.inputs.workers || '4' }}
          INPUT_ONLY: ${{ github.event.inputs.only }}
        run: |
          P="$INPUT_PROFILE"
          W="$INPUT_WORKERS"
          O="$INPUT_ONLY"
          mkdir -p reports
          set +e
          if [ -n "$O" ]; then
            python -m winning.ratings.verify --profile "$P" --workers "$W" --out reports --only $O
          else
            python -m winning.ratings.verify --profile "$P" --workers "$W" --out reports
          fi
          CODE=$?
          set -e
          cat reports/*.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "verify exit code $CODE"
          exit $CODE
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ratings-verify-${{ github.event.inputs.profile || 'full' }}-${{ github.run_id }}
          path: reports/
          retention-days: 90
