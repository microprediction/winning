name: Julia

on:
  push:
    branches: [main]
    paths: ['julia/**', '.github/workflows/julia.yml']
  pull_request:
    paths: ['julia/**', '.github/workflows/julia.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [winning, MultinomialProbit, FactorMvNormalCDF, GMRFExtremes]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - name: Test ${{ matrix.package }}
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path = "julia/${{ matrix.package }}")
          Pkg.test("${{ matrix.package }}")
