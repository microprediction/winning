name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate. A release is the one action that cannot be taken back, so it
  # runs more than a build: the full suite on the source, then the SHIPPED
  # wheel installed into a clean environment and exercised from a directory
  # where the source tree cannot shadow the import. install-smoke.yml runs
  # the same script again afterwards against PyPI itself.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Version matches the tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl)
          case "$WHEEL" in
            *winning-"$TAG"-*) echo "wheel matches tag $TAG" ;;
            *) echo "tag $TAG does not match $WHEEL"; exit 1 ;;
          esac
      - name: Test suite on the source
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Contract and smoke on the built wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /tmp/wheelenv/bin/python "$GITHUB_WORKSPACE/.github/smoke.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
