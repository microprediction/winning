name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate. A release is the one action that cannot be taken back, so it
  # runs more than a build: the full suite on the source, then the SHIPPED
  # wheel installed into a clean environment and exercised from a directory
  # where the source tree cannot shadow the import. install-smoke.yml runs
  # the same script again afterwards against PyPI itself.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Version matches the tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl)
          case "$WHEEL" in
            *winning-"$TAG"-*) echo "wheel matches tag $TAG" ;;
            *) echo "tag $TAG does not match $WHEEL"; exit 1 ;;
          esac
      - name: Test suite on the source
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Contract and smoke on the built wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /tmp/wheelenv/bin/python "$GITHUB_WORKSPACE/.github/smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
