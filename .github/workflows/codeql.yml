name: CodeQL

# Static analysis of every language here that CodeQL supports. All four
# run with build-mode: none, so nothing is compiled or installed: the
# Rust crates are extracted from source, and the GitHub Actions
# workflows themselves are analysed as a language of their own. Julia
# and R are not supported by CodeQL.
#
# Vendored third-party code is excluded so findings are about this
# repository: research/restriction/data/ holds a copied browser
# experiment (jQuery 2.1.4, md5.js and friends), and attic/ is frozen.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 2"   # Tuesdays 05:17 UTC

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read          # check out the code
      security-events: write  # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - research/restriction/data
              - attic
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
