name: install-smoke

# Installs winning FROM PyPI on a clean runner (no source checkout shadowing
# the import) and exercises the published wheel. Three triggers:
#   * workflow_dispatch — on demand (override the spec, e.g. winning==1.3.0)
#   * schedule          — weekly drift canary: does `pip install winning`
#                         still work today, on today's numpy and scipy?
#   * workflow_run      — right after a successful publish, so every release
#                         is validated as users will actually receive it
# Note: schedule/workflow_run only fire once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "pip install spec"
        default: "winning"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]

defaults:
  run:
    shell: bash   # uniform across ubuntu/macos/windows runners

jobs:
  smoke:
    # after a publish, only bother if the publish actually succeeded
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Fetch the smoke script only (not the package source)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install winning from PyPI
        run: |
          python -m pip install --upgrade pip
          SPEC="${{ github.event.inputs.spec || 'winning' }}"
          echo "installing: $SPEC"
          # PyPI can lag a publish by a few seconds; retry rather than
          # failing a release check on propagation
          for attempt in 1 2 3 4 5; do
            python -m pip install $SPEC && break
            echo "attempt $attempt failed; waiting"
            sleep 20
          done
          python -c "import winning; print(winning.__version__)"
      - name: Smoke test the installed wheel
        run: python .github/smoke.py
