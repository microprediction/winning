name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  test-minimal:
    # the shipped core must work with numpy and scipy alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: pip install -e . pytest
      - name: Core tests
        run: python -m pytest -q tests/test_races.py tests/test_probit.py tests_thurstone

  package:
    # What gets SHIPPED, not what is in the tree. setup.py lists packages
    # explicitly, so a new subpackage is invisible to users until someone
    # adds it there -- a failure that no source-tree test can see. Build
    # the wheel, prove every subpackage made it in, then exercise the
    # installed copy from outside the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Every subpackage is in the wheel
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile, sys
          src = {str(p.parent.relative_to('.')).replace('/', '.')
                 for p in pathlib.Path('winning').rglob('__init__.py')}
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          shipped = {n[:-len('/__init__.py')].replace('/', '.')
                     for n in names if n.endswith('__init__.py')}
          missing = sorted(src - shipped)
          print('source:', len(src), 'shipped:', len(shipped))
          if missing:
              sys.exit(f"not in the wheel (add to setup.py packages): {missing}")
          PY
      - name: Smoke the installed wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /tmp/wheelenv/bin/python "$GITHUB_WORKSPACE/.github/smoke.py"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check winning/factor winning/probit src
