name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  test-minimal:
    # the shipped core must work with numpy and scipy alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: pip install -e . pytest
      - name: Core tests
        run: python -m pytest -q tests/test_races.py tests/test_probit.py tests_research

  package:
    # What gets SHIPPED, not what is in the tree. setup.py lists packages
    # explicitly, so a new subpackage is invisible to users until someone
    # adds it there -- a failure that no source-tree test can see. Build
    # the wheel, prove every subpackage made it in, then exercise the
    # installed copy from outside the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Every subpackage is in the wheel
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile, sys
          src = {str(p.parent.relative_to('.')).replace('/', '.')
                 for p in pathlib.Path('winning').rglob('__init__.py')}
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          shipped = {n[:-len('/__init__.py')].replace('/', '.')
                     for n in names if n.endswith('__init__.py')}
          missing = sorted(src - shipped)
          print('source:', len(src), 'shipped:', len(shipped))
          if missing:
              sys.exit(f"not in the wheel (add to setup.py packages): {missing}")
          PY
      - name: Smoke the installed wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /tmp/wheelenv/bin/python "$GITHUB_WORKSPACE/.github/smoke.py"
      - name: Benchmarks from the installed wheel write to cwd (#141)
        # RESULTS used to be <site-packages>/bench_results; a comparator
        # without trueskill failed at import, not with an install hint
        run: |
          mkdir -p /tmp/benchcwd && cd /tmp/benchcwd
          /tmp/wheelenv/bin/python -c "import winning.bench.season_ranked, winning.bench.season_trueskill"
          printf '%s\n' '{"problem": "p", "n": 2, "k": 1, "method": "m", "budget": null, "seconds": 0.1, "max_err": 1e-4, "max_log_err": 0.01, "info": {}}' > records.jsonl
          /tmp/wheelenv/bin/python -m winning.bench.leaderboard --out /tmp/benchcwd
          test -f /tmp/benchcwd/LEADERBOARD.md
          site=$(/tmp/wheelenv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          test ! -e "$site/bench_results"
          /tmp/wheelenv/bin/pip install "$(ls $GITHUB_WORKSPACE/dist/*.whl)[benchmarks]"
          /tmp/wheelenv/bin/python -c "import trueskill"
      - name: Every test shipped in the sdist can be collected (#141)
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/winning-*
          if [ -d tests ]; then
            /tmp/wheelenv/bin/pip install pytest
            /tmp/wheelenv/bin/python -m pytest --collect-only -q tests
          else
            echo "sdist ships no tests (MANIFEST.in prunes them)"
          fi

  parity:
    # The cross-language comparison has always existed and has never been
    # gated: it was run by hand, which is why three divergences reached main
    # before anyone noticed (#153, #171, #178). Two things are checked here.
    #
    # 1. The committed vectors still describe the python reference. If a
    #    python change moves any scenario and the vectors were not
    #    regenerated, the committed file is stale and the ports are being
    #    compared against yesterday's answers -- which was true of eleven
    #    scenarios when this job was written.
    # 2. R and the browser reproduce those vectors within each scenario's
    #    own tolerance. A scenario a port does not implement is a failure,
    #    not a skip; both checkers already treat it that way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install
        run: |
          pip install -e ".[test]"
          Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Vectors still describe the python reference
        # Not byte-equality: regenerating on another platform moves the
        # iterative scenarios in the last digits (BLAS reduction order), as
        # this job demonstrated on its first run. Each scenario is compared
        # at the same tolerance the ports must meet.
        run: WINNING_PURE=1 python parity/check_vectors.py
      - name: R port
        run: Rscript parity/check.R
      - name: Browser port
        run: node parity/check.mjs
      - name: Browser API guards
        # behavioural, not source markers: #186 shipped because the tests
        # read the source and a shared allowlist let each API accept the
        # other's options and ignore them
        run: node parity/check_js_api.mjs
      - name: Browser factor race vs scipy
        # js/factor/test_parity.mjs checks the tabulated bases against
        # scipy-generated vectors, and nothing ran it: it sat failing on
        # main at 1.01e-5 against its own 2e-6 tolerance until #211, which
        # is exactly how long an ungated suite stays broken (#140).
        run: node js/factor/test_parity.mjs
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Ports agree about what they REFUSE
        # check_vectors/check.mjs/check.R/check.jl compare the ports'
        # VALUES on well-formed inputs. Nothing compared their DECISIONS
        # on malformed ones, and that is where they drifted: ten of
        # thirty cases diverged, and a port that quietly recycles a
        # short D agrees on every vector in those files while pricing a
        # different race. The check skips any port whose toolchain is
        # absent rather than passing vacuously -- except here, where all
        # four are installed and an absence means the install broke.
        run: python parity/check_divergence.py --require-all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          # `src` was the pre-renovation package; it is deleted, and
          # attic/ is frozen by definition so it is not linted
          ruff check winning/factor winning/probit winning/ratings/verify winning/ratings/simulate.py
