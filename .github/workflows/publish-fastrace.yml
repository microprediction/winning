name: Publish fastrace to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload to PyPI (false = build wheels only)"
        type: boolean
        default: false

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: rust/fastrace
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: rust/fastrace/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: rust/fastrace
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: rust/fastrace/dist

  # Install-and-call every artifact before it can be uploaded (#72). The
  # wheels used to be built and published without ever being imported,
  # so a wheel that failed to load, or disagreed with the numpy
  # reference, would have shipped. aarch64 is cross-built and cannot run
  # on these runners; it is covered by the same source in the x86_64 job.
  test-wheels:
    needs: [wheels, sdist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-ubuntu-latest-x86_64
          - os: macos-latest
            artifact: wheels-macos-latest-universal2-apple-darwin
          - os: windows-latest
            artifact: wheels-windows-latest-x64
          - os: ubuntu-latest
            artifact: wheels-sdist
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branch head on 2026-10-05)
        if: matrix.artifact == 'wheels-sdist'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: built
      - name: Install the built artifact (not the checkout's crate)
        run: |
          pip install -e ".[test]"
          if [ "${{ matrix.artifact }}" = "wheels-sdist" ]; then
            pip install maturin
            pip install built/*.tar.gz
          else
            pip install --no-index --find-links built fastrace
          fi
      - name: The compiled path is live
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import fastrace, winning
          from winning import rustconfig
          print("fastrace", md.version("fastrace"), "from", fastrace.__file__)
          assert winning.rust_active()
          off = [m.__name__ for m in rustconfig._rust_modules() if not getattr(m, "_HAVE_RUST", False)]
          assert not off, off
          PY
      - name: Parity against the numpy reference, no skips allowed
        run: |
          python -m pytest -q -rs tests/test_rust_parity.py \
            tests/test_rust_dispatch_core.py \
            tests/test_rust_gauge_and_normalized_jvp.py \
            tests/test_loading_shapes.py | tee native.txt
          if grep -q "SKIPPED" native.txt; then exit 1; fi

  publish:
    if: ${{ inputs.publish }}
    needs: [wheels, sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
