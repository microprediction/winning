[package]
name = "fastrace"
version = "0.1.1"
edition = "2021"
description = "Compiled kernels for the winning package (factor/block/nested/tree races, classic calibration)"
license = "MIT"

[lib]
name = "fastrace"
crate-type = ["cdylib"]

[dependencies]
fastrace-core = { path = "../fastrace-core" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
