[package]
name = "fastrace"
version = "0.3.0"
edition = "2021"
description = "Compiled kernels for the winning package (factor/block/nested/tree races, classic calibration)"
license = "MIT"

[lib]
name = "fastrace"
crate-type = ["cdylib"]

[dependencies]
winning = { path = "../winning", version = "0.3.0" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
rayon = "1.10"

