[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "fastrace"
description = "Compiled kernels for the `winning` package: factor/block/nested/tree race probabilities and the classic state-price calibration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Peter Cotton" }]
requires-python = ">=3.9"
# the PyO3 numpy bindings need NumPy's C API at the first array call;
# without this a clean `pip install fastrace` imported and then panicked
# (#115)
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/microprediction/winning"
